# Use Ctrl-a as the prefix.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes and create windows in the current pane's directory.
unbind '"'
bind - split-window -v -c '#{pane_current_path}'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Reload this file without restarting the server.
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Interaction.
set -g mouse on
set -g set-clipboard external
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Make the focused pane obvious against the Gruvbox Light background.
setw -g pane-border-style 'fg=#a89984'
setw -g pane-active-border-style 'fg=#af3a03'
setw -g pane-border-indicators both
setw -g pane-border-status top
setw -g pane-border-format '#[fg=#{?pane_active,#fbf1c7,#7c6f64},bg=#{?pane_active,#af3a03,default}] #{?pane_active,▶ ACTIVE ,}#{?pane_marked,◆ MARKED ,}#P #[default]'

# Move between panes with hjkl.
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Swap the focused pane with its spatial neighbour (uppercase hjkl).
# Pin the source explicitly so a marked pane cannot change the operation.
bind -r H swap-pane -d -s '{active}' -t '{left-of}'
bind -r J swap-pane -d -s '{active}' -t '{down-of}'
bind -r K swap-pane -d -s '{active}' -t '{up-of}'
bind -r L swap-pane -d -s '{active}' -t '{right-of}'

# Mark a source, focus a destination, then insert beside it with arrow keys.
bind M select-pane -m
bind Left run-shell 'bash ~/.tmux.conf.sh place-marked left #{pane_id}'
bind Down run-shell 'bash ~/.tmux.conf.sh place-marked down #{pane_id}'
bind Up run-shell 'bash ~/.tmux.conf.sh place-marked up #{pane_id}'
bind Right run-shell 'bash ~/.tmux.conf.sh place-marked right #{pane_id}'

# Choose a session, then an existing window or a new window for this pane.
bind m run-shell 'bash ~/.tmux.conf.sh move-pane-menu #{pane_id} #{q:client_name}'

# Resize with prefix + Ctrl-h/j/k/l.
bind -r C-k resize-pane -U 2
bind -r C-j resize-pane -D 2
bind -r C-h resize-pane -L 2
bind -r C-l resize-pane -R 2

# Vi-style copy mode. Platform clipboard bindings are installed below.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 5
set -g status-justify left
setw -g monitor-activity on

# Advertise tmux's terminal capabilities and RGB support.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',screen-256color:RGB'

run-shell 'bash ~/.tmux.conf.sh'
