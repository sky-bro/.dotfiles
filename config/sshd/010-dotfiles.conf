# Managed by ~/.dotfiles/config/sshd/manage.sh.

# Limit remote login to the personal account and never permit root.
AllowUsers sky
PermitRootLogin no

# Password login is an explicit personal choice. Keep public-key login
# available for a future authorized_keys entry.
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PermitEmptyPasswords no
UsePAM yes

# Reduce password guessing opportunities without affecting normal use.
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 5

# Features not used by this personal service.
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
